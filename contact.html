 <link rel="stylesheet" href="contact.css">   <title>NASRULLAH MALIK | Contact</title>

<header>
    <h1>Contact Me</h1>
    <p>Let's connect</p>
    


</header>

<hr>

<main>
    <h2>Get In Touch</h2>
    <p>Have a project or question? Send me a message.</p>

    <form>
        <p>
            <label for="name">Your Name:</label><br>
            <input type="text" id="name" name="name" placeholder="Enter your name">
        </p>

        <p>
            <label for="email">Your Email:</label><br>
            <input type="email" id="email" name="email" placeholder="Enter your email">
        </p>

        <p>
            <label for="subject">Subject:</label><br>
            <input type="text" id="subject" name="subject" placeholder="Enter subject">
        </p>

        <p>
            <label for="message">Your Message:</label><br>
            <textarea id="message" name="message" rows="7" cols="45"
                      placeholder="Write your message"></textarea>
        </p>

        <button type="submit">Send Message</button>
        <button type="reset">Clear</button>
    </form>

    <h3>Social Links</h3>
    <p>
        <a href="https://github.com/graphenixcreative-hue" target="_blank">GitHub</a>
    </p>
